# A minimal nginx server for docker-compose.yml: static files from /var/www/html,
# and .php requests passed over FastCGI to the php service on port 9000. Both
# containers mount the same ./src at /var/www/html, so the paths match.
server {
    listen 80;
    server_name _;
    root /var/www/html;
    index index.php index.html;

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location ~ \.php$ {
        try_files $uri =404;
        fastcgi_pass php:9000;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
    }

    # Hidden files such as .env or .git are never served.
    location ~ /\.(?!well-known/) {
        deny all;
    }
}
