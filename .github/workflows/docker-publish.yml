name: Docker Publish

on:
  # Run on pushes to the master branch, but only if relevant files have changed.
  push:
    branches: [ "master" ]
    paths:
      - 'Dockerfile'
      - 'scripts/**'
      - 'data/**'
      - 'README.dockerhub.md'
      - 'README.dockerhub-org.md'
  # Allow the workflow to be triggered manually from the GitHub Actions UI.
  workflow_dispatch:

jobs:
  build_and_publish:
    runs-on: ubuntu-latest
    if: github.repository == 'morsalin1342/php-docker'
    permissions:
      contents: read

    # Use a matrix strategy to build for multiple PHP versions and image variants in parallel.
    strategy:
      fail-fast: false
      matrix:
        php_version: [ '8.2', '8.3', '8.4', '8.5' ]
        image_type: [ 'fpm', 'cli' ]
        debian_release: [ 'trixie' ]

    steps:
      - name: Check out the repo
        uses: actions/checkout@v7

      - name: Sync supported-extensions from upstream
        run: |
          curl -fsSL https://raw.githubusercontent.com/mlocati/docker-php-extension-installer/master/data/supported-extensions \
            -o data/supported-extensions
          echo "::group::Extension compatibility check"
          echo "Checking that all installable extensions exist upstream..."
          MISSING=""
          while IFS= read -r ext; do
            [ -z "$ext" ] && continue
            if ! grep -q "^${ext} " data/supported-extensions; then
              echo "::warning::Extension '${ext}' not found in upstream supported-extensions"
              MISSING="${MISSING} ${ext}"
            fi
          done < data/installable-extensions
          if [ -n "$MISSING" ]; then
            echo "::error::Unknown extensions:${MISSING}"
            exit 1
          fi
          echo "All installable extensions are valid ✓"
          echo "::endgroup::"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKER_HUB_USERNAME }}
          password: ${{ secrets.DOCKER_HUB_ACCESS_TOKEN }}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: |
            morsalin1342/php
            easydigital/php
          # Generate tags based on the PHP version and image type.
          # Example for php_version=8.4, image_type=fpm: 8.4-fpm, 8.4-fpm-trixie
          # Example for php_version=8.4, image_type=cli: 8.4-cli, 8.4-cli-trixie
          # Only trixie is built. bookworm is built again only for a PHP version whose
          # official image has no trixie variant. The -trixie tags stay as aliases, and
          # the old -bookworm tags are no longer updated.
          tags: |
            type=raw,value=${{ matrix.php_version }}-${{ matrix.image_type }}-${{ matrix.debian_release }}
            type=raw,value=${{ matrix.php_version }}-${{ matrix.image_type }}
            type=raw,value=latest-${{ matrix.image_type }},enable=${{ matrix.php_version == '8.5' }}

      - name: Build and push Docker image
        id: build-and-push
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Dockerfile
          push: true
          # Pass the PHP version and image type as build arguments.
          build-args: |
            PHP_VERSION=${{ matrix.php_version }}
            IMAGE_TYPE=${{ matrix.image_type }}
            DEBIAN_RELEASE=${{ matrix.debian_release }}
          # Use the tags generated by the metadata-action step.
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # Enable GHA caching for faster builds.
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Interim scanning (planning: TASK-0008, Q-150), until the Cloud Build pipeline exists: after the push,
      # a fixable critical vulnerability fails the run, and an SPDX SBOM is kept as a workflow artifact.
      - name: Scan the pushed image for fixable critical vulnerabilities
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: easydigital/php:${{ matrix.php_version }}-${{ matrix.image_type }}-${{ matrix.debian_release }}
          format: table
          severity: CRITICAL
          ignore-unfixed: true
          exit-code: '1'

      - name: Write the SBOM
        if: always()
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: easydigital/php:${{ matrix.php_version }}-${{ matrix.image_type }}-${{ matrix.debian_release }}
          format: spdx-json
          output: sbom.spdx.json
          exit-code: '0'

      - name: Keep the SBOM
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: sbom-php-${{ matrix.php_version }}-${{ matrix.image_type }}-${{ matrix.debian_release }}
          path: sbom.spdx.json

  update_readme:
    # This job runs only after all matrix jobs in 'build_and_publish' have succeeded.
    needs: build_and_publish
    runs-on: ubuntu-latest
    if: github.repository == 'morsalin1342/php-docker'
    steps:
      - name: Check out the repo
        uses: actions/checkout@v7

      - name: Update Docker Hub description (personal repo)
        uses: peter-evans/dockerhub-description@v5
        with:
          username: ${{ secrets.DOCKER_HUB_USERNAME }}
          password: ${{ secrets.DOCKER_HUB_ACCESS_TOKEN }}
          repository: morsalin1342/php
          readme-filepath: ./README.dockerhub.md
          short-description: 'Production-ready PHP-FPM & CLI images: 52 extensions, Composer, WP-CLI, Node.js. PHP 8.2-8.5'

      - name: Update Docker Hub description (org repo)
        uses: peter-evans/dockerhub-description@v5
        with:
          username: ${{ secrets.DOCKER_HUB_USERNAME }}
          password: ${{ secrets.DOCKER_HUB_ACCESS_TOKEN }}
          repository: easydigital/php
          readme-filepath: ./README.dockerhub-org.md
          short-description: 'Production-ready PHP-FPM & CLI images: 52 extensions, Composer, WP-CLI, Node.js. PHP 8.2-8.5'
