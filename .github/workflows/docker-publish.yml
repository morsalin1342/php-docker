name: Docker Publish

on:
  # Run on pushes to the master branch, but only if relevant files have changed.
  push:
    branches: [ "master" ]
    paths:
      - 'Dockerfile'
      - 'scripts/**'
      - 'data/**'
      - 'README.dockerhub.md'
      - 'README.dockerhub-org.md'
  # A pull request builds and scans every image. It never logs in and never pushes.
  pull_request:
    paths:
      - 'Dockerfile'
      - 'scripts/**'
      - 'data/**'
      - '.github/workflows/docker-publish.yml'
  # Weekly rebuild, so PHP patch releases, Debian security updates and a moved base
  # image reach the published tags without waiting for a commit. It writes the same
  # tags as a push.
  schedule:
    - cron: '23 6 * * 1'
  # Allow the workflow to be triggered manually from the GitHub Actions UI.
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build_and_publish:
    runs-on: ubuntu-latest
    if: github.repository == 'morsalin1342/php-docker'

    # Use a matrix strategy to build for multiple PHP versions and image variants in parallel.
    strategy:
      fail-fast: false
      matrix:
        php_version: [ '8.2', '8.3', '8.4', '8.5' ]
        image_type: [ 'fpm', 'cli' ]
        debian_release: [ 'trixie' ]

    steps:
      - name: Check out the repo
        uses: actions/checkout@v7

      - name: Sync supported-extensions from upstream
        run: |
          curl -fsSL https://raw.githubusercontent.com/mlocati/docker-php-extension-installer/master/data/supported-extensions \
            -o data/supported-extensions
          echo "::group::Extension compatibility check"
          echo "Checking that all installable extensions exist upstream..."
          MISSING=""
          while IFS= read -r ext; do
            [ -z "$ext" ] && continue
            if ! grep -q "^${ext} " data/supported-extensions; then
              echo "::warning::Extension '${ext}' not found in upstream supported-extensions"
              MISSING="${MISSING} ${ext}"
            fi
          done < data/installable-extensions
          if [ -n "$MISSING" ]; then
            echo "::error::Unknown extensions:${MISSING}"
            exit 1
          fi
          echo "All installable extensions are valid ✓"
          echo "::endgroup::"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: |
            morsalin1342/php
            easydigital/php
          # Generate tags based on the PHP version and image type.
          # Example for php_version=8.4, image_type=fpm: 8.4-fpm, 8.4-fpm-trixie
          # Example for php_version=8.4, image_type=cli: 8.4-cli, 8.4-cli-trixie
          # Only trixie is built. bookworm is built again only for a PHP version whose
          # official image has no trixie variant. The -trixie tags stay as aliases, and
          # the old -bookworm tags are no longer updated.
          # The bare version tags and `latest` are FPM, as they were before the -fpm/-cli
          # split. They stopped being written then and kept serving the 2026-04-06 images;
          # writing them here keeps `docker pull morsalin1342/php` and `:8.4` current.
          tags: |
            type=raw,value=${{ matrix.php_version }}-${{ matrix.image_type }}-${{ matrix.debian_release }}
            type=raw,value=${{ matrix.php_version }}-${{ matrix.image_type }}
            type=raw,value=latest-${{ matrix.image_type }},enable=${{ matrix.php_version == '8.5' }}
            type=raw,value=${{ matrix.php_version }},enable=${{ matrix.image_type == 'fpm' }}
            type=raw,value=latest,enable=${{ matrix.php_version == '8.5' && matrix.image_type == 'fpm' }}

      # Build into the runner's Docker daemon only. Nothing leaves the runner until
      # the scan below has passed. The labels are the ones the push uses, so the two
      # builds have the same inputs.
      - name: Build the image locally
        id: build
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Dockerfile
          load: true
          push: false
          # Pass the PHP version and image type as build arguments.
          build-args: |
            PHP_VERSION=${{ matrix.php_version }}
            IMAGE_TYPE=${{ matrix.image_type }}
            DEBIAN_RELEASE=${{ matrix.debian_release }}
          tags: local/php:scan
          labels: ${{ steps.meta.outputs.labels }}
          # Enable GHA caching for faster builds, one cache per matrix entry so the
          # entries do not overwrite each other's cache.
          cache-from: type=gha,scope=php-${{ matrix.php_version }}-${{ matrix.image_type }}-${{ matrix.debian_release }}
          cache-to: type=gha,mode=max,scope=php-${{ matrix.php_version }}-${{ matrix.image_type }}-${{ matrix.debian_release }}

      # A fixable critical vulnerability fails the run before anything is pushed.
      - name: Scan the image for fixable critical vulnerabilities
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: local/php:scan
          format: table
          severity: CRITICAL
          ignore-unfixed: true
          exit-code: '1'

      - name: Write the SBOM
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: local/php:scan
          format: spdx-json
          output: sbom.spdx.json
          exit-code: '0'

      - name: Keep the SBOM
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        uses: actions/upload-artifact@v7
        with:
          name: sbom-php-${{ matrix.php_version }}-${{ matrix.image_type }}-${{ matrix.debian_release }}
          path: sbom.spdx.json

      - name: Log in to Docker Hub
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKER_HUB_USERNAME }}
          password: ${{ secrets.DOCKER_HUB_ACCESS_TOKEN }}

      # Same context and inputs as the local build on the same builder, so every
      # layer comes from that build's cache: what is pushed is what was scanned.
      # One build writes every tag, so both namespaces get the same digest.
      - name: Push the scanned image
        if: github.event_name != 'pull_request'
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Dockerfile
          push: true
          build-args: |
            PHP_VERSION=${{ matrix.php_version }}
            IMAGE_TYPE=${{ matrix.image_type }}
            DEBIAN_RELEASE=${{ matrix.debian_release }}
          # Use the tags generated by the metadata-action step.
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=php-${{ matrix.php_version }}-${{ matrix.image_type }}-${{ matrix.debian_release }}

      - name: Check the pushed layers are the scanned layers
        if: github.event_name != 'pull_request'
        env:
          PUSHED: easydigital/php:${{ matrix.php_version }}-${{ matrix.image_type }}-${{ matrix.debian_release }}
        run: |
          scanned=$(docker image inspect local/php:scan --format '{{json .RootFS.Layers}}' | jq -c .)
          pushed=$(docker buildx imagetools inspect "$PUSHED" --format '{{json .Image.RootFS.DiffIDs}}' | jq -c .)
          if [ "$scanned" != "$pushed" ]; then
            echo "::error::The pushed image's layers differ from the scanned image's layers."
            echo "scanned: $scanned"
            echo "pushed:  $pushed"
            exit 1
          fi

  update_readme:
    # This job runs only after all matrix jobs in 'build_and_publish' have succeeded,
    # and never for a pull request.
    needs: build_and_publish
    runs-on: ubuntu-latest
    if: github.repository == 'morsalin1342/php-docker' && github.event_name != 'pull_request'
    steps:
      - name: Check out the repo
        uses: actions/checkout@v7

      - name: Update Docker Hub description (personal repo)
        uses: peter-evans/dockerhub-description@v5
        with:
          username: ${{ secrets.DOCKER_HUB_USERNAME }}
          password: ${{ secrets.DOCKER_HUB_ACCESS_TOKEN }}
          repository: morsalin1342/php
          readme-filepath: ./README.dockerhub.md
          short-description: 'PHP-FPM & CLI images: 52 extensions, Composer, WP-CLI, Node.js. PHP 8.2-8.5'

      - name: Update Docker Hub description (org repo)
        uses: peter-evans/dockerhub-description@v5
        with:
          username: ${{ secrets.DOCKER_HUB_USERNAME }}
          password: ${{ secrets.DOCKER_HUB_ACCESS_TOKEN }}
          repository: easydigital/php
          readme-filepath: ./README.dockerhub-org.md
          short-description: 'PHP-FPM & CLI images: 52 extensions, Composer, WP-CLI, Node.js. PHP 8.2-8.5'
